<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red Lions Yaklaşan Etkinlikler</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b3a;--red:#d7262e;--sand:#f4f1ec;--muted:#5a6478}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Helvetica,Arial,sans-serif;color:var(--navy);background:#fff}
.wrap{max-width:980px;margin:0 auto;padding:36px 20px}
.lbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700;text-align:center}
h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:44px;margin:6px 0 26px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--sand);display:flex;flex-direction:column}
.date{background:var(--navy);color:#fff;padding:16px 18px;display:flex;align-items:baseline;gap:10px}
.card.key .date{background:var(--red)}
.date b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:32px;line-height:1}
.date span{font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.info{padding:16px 18px 20px;flex:1}
.info strong{display:block;font-size:16px;line-height:1.3}
.info small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.more{display:block;width:max-content;margin:26px auto 0;padding:12px 26px;border:2px solid var(--navy);color:var(--navy);text-decoration:none;font:700 13px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.more:hover{background:var(--navy);color:#fff}
.empty{background:var(--sand);padding:30px;text-align:center;color:var(--muted)}
@media(max-width:700px){.grid{grid-template-columns:1fr}h2{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="lbl" lang="en">Red Lions Sailing Team</div>
 <h2>YAKLAŞAN ETKİNLİKLER</h2>
 <div class="grid" id="g"></div>
 <a class="more" id="more" href="#" target="_top">Tüm takvim</a>
</div>
<script>
// Kaynak: 2027 yarış takvimi (redlions-takvim-wix.html ile aynı liste). Takvim değişince ikisi birlikte güncellenir.
var EV=[
 ["2027-01-16","2027-01-17","MIYC Kış Trofesi · 1. Ayak","Yat yarışları",0],
 ["2027-02-06","2027-02-07","MIYC Kış Trofesi · 2. Ayak","Yat yarışları",0],
 ["2027-02-27","2027-02-28","MIYC Kış Trofesi · 3. Ayak","Yat yarışları",0],
 ["2027-03-13","2027-03-14","MIYC Kış Trofesi · 4. Ayak","Yat yarışları",0],
 ["2027-04-03","2027-04-04","MIYC Kış Trofesi · 5. Ayak","Yat yarışları",0],
 ["2027-04-24","2027-04-25","MIYC Kış Trofesi · 6. Ayak","Yat yarışları",0],
 ["2027-05-01","2027-05-07","Uluslararası Loryma Cup","Uluslararası yarış",1],
 ["2027-10-23","2027-10-29","38. Marmaris Uluslararası Yarış Haftası","Uluslararası yarış",1],
 ["2027-12-04","2027-12-05","Burhanettin Tekdağ Yıl Sonu Kupası","Sezon finali",0]
];
var AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
// Alan adı bağlanınca bu adres güncellenmeli.
var TAKVIM_URL="https://stepsonclouds.wixsite.com/redlionssailingteam/takvim";
function d(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
var today=new Date();today.setHours(0,0,0,0);
var up=EV.filter(function(e){return d(e[1])>=today;}).slice(0,3);
var g=document.getElementById("g");
if(!up.length){g.outerHTML='<div class="empty">Yeni sezon takvimi yakında.</div>';}
up.forEach(function(e){
 var a=d(e[0]),b=d(e[1]);
 var days=a.getMonth()===b.getMonth()?a.getDate()+"–"+b.getDate():a.getDate()+" "+AY[a.getMonth()]+" – "+b.getDate();
 var c=document.createElement("div");c.className="card"+(e[4]?" key":"");
 c.innerHTML='<div class="date"><b>'+days+'</b><span>'+AY[b.getMonth()]+' '+b.getFullYear()+'</span></div><div class="info"><strong>'+e[2]+'</strong><small>'+e[3]+'</small></div>';
 g.appendChild(c);
});
var m=document.getElementById("more");
if(TAKVIM_URL){m.href=TAKVIM_URL;}else{m.style.display="none";}
</script>
</body>
</html>
